name: Daily Email Sender

on:
schedule:
# Berjalan pada 01:00 UTC (Sama dengan 08:00 WIB Pagi)
# Jadwal: Hari Senin sampai Sabtu (1-6)
- cron: '0 1 * * 1-6'
workflow_dispatch: # Tombol run manual

jobs:
send-emails:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v3

  - name: Setup Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  - name: Install Dependencies
    run: pip install requests

  - name: Run Email Sender Script
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_NAME: "Tim Baja Jabodetabek"
    run: python send_email.py
